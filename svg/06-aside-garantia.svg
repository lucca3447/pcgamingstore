<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220" width="1440" height="220">
  <defs>
    <linearGradient id="asideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1612" />
      <stop offset="50%" stop-color="#14161D" />
      <stop offset="100%" stop-color="#101117" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A26" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF5A26" />
    </linearGradient>
  </defs>

  <rect width="1440" height="220" fill="#0D0E12" />

  <!-- Bloco Central do Aside com Borda Gradiente -->
  <g transform="translate(80, 25)">
    <rect width="1280" height="170" rx="16" fill="url(#asideBg)" stroke="url(#goldBorder)" stroke-width="2" />

    <!-- Escudo / Badge de Garantia à Esquerda -->
    <g transform="translate(45, 25)">
      <polygon points="60,0 120,0 128,45 60,95 -8,45 0,0" fill="#181A20" stroke="#FFB800" stroke-width="2.5" />
      <text x="60" y="24" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#FFB800" text-anchor="middle" letter-spacing="1">
        EXCLUSIVO
      </text>
      <text x="60" y="52" font-family="'Oxanium', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">
        2 ANOS
      </text>
      <text x="60" y="70" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#FF5A26" text-anchor="middle" letter-spacing="0.5">
        DE GARANTIA
      </text>
    </g>

    <!-- Texto de Destaque no Meio -->
    <g transform="translate(200, 40)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#FFB800" letter-spacing="2">
        SEGURANÇA E CONFIANÇA TOTAL
      </text>
      <text x="0" y="32" font-family="'Oxanium', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">
        A Única com 2 Anos de Garantia Premium em Feira de Santana
      </text>
      <text x="0" y="62" font-family="'Inter', sans-serif" font-size="13.5" fill="#D1D5DB">
        Tranquilidade absoluta para o seu investimento. Suporte humanizado e assistência direta no balcão sem enrolação.
      </text>
    </g>

    <!-- Botão de Ação Imediata à Direita -->
    <g transform="translate(1010, 60)" cursor="pointer">
      <rect width="220" height="50" rx="10" fill="#FF5A26" />
      <text x="110" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#0D0E12" text-anchor="middle">
        Falar com o Especialista
      </text>
    </g>
  </g>
</svg>
