<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 580" width="1440" height="580">
  <rect width="1440" height="580" fill="#12141A" />
  <line x1="0" y1="0" x2="1440" y2="0" stroke="#22252E" stroke-width="1" />

  <!-- Cabeçalho da Seção -->
  <g transform="translate(80, 40)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FF5A26" letter-spacing="2">
      ORÇAMENTO E ATENDIMENTO
    </text>
    <text x="0" y="32" font-family="'Oxanium', 'Orbitron', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">
      SIMULE SEU SETUP OU AGENDE UMA MANUTENÇÃO
    </text>
    <text x="0" y="58" font-family="'Inter', sans-serif" font-size="14.5" fill="#9CA3AF">
      Receba uma cotação transparente e personalizada diretamente com os nossos técnicos de bancada em Feira de Santana.
    </text>
  </g>

  <!-- Caixa do Formulário Centralizada -->
  <g transform="translate(240, 130)">
    <!-- Container do Formulário -->
    <rect width="960" height="400" rx="16" fill="#181A20" stroke="#2D3139" stroke-width="1.5" />

    <!-- LINHA 1: Nome e WhatsApp -->
    <!-- Campo Nome -->
    <g transform="translate(40, 30)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#D1D5DB">
        Seu Nome Completo *
      </text>
      <rect x="0" y="10" width="415" height="46" rx="8" fill="#22252E" stroke="#2D3139" stroke-width="1.2" />
      <text x="16" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#6B7280">
        Ex: João Lucca Sotero
      </text>
    </g>

    <!-- Campo WhatsApp -->
    <g transform="translate(505, 30)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#D1D5DB">
        WhatsApp com DDD *
      </text>
      <rect x="0" y="10" width="415" height="46" rx="8" fill="#22252E" stroke="#2D3139" stroke-width="1.2" />
      <text x="16" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#6B7280">
        Ex: (75) 99999-9999
      </text>
    </g>

    <!-- LINHA 2: Tipo de Serviço e Faixa de Orçamento -->
    <!-- Campo Tipo de Serviço -->
    <g transform="translate(40, 110)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#D1D5DB">
        Tipo de Serviço Pretendido *
      </text>
      <rect x="0" y="10" width="415" height="46" rx="8" fill="#22252E" stroke="#FF5A26" stroke-width="1.2" />
      <text x="16" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#F3F4F6">
        Montagem de PC Gamer Completo (2 Anos Garantia)
      </text>
      <!-- Seta Dropdown -->
      <polygon points="385,32 393,32 389,38" fill="#FF5A26" />
    </g>

    <!-- Campo Faixa de Investimento -->
    <g transform="translate(505, 110)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#D1D5DB">
        Faixa Estimada de Investimento
      </text>
      <rect x="0" y="10" width="415" height="46" rx="8" fill="#22252E" stroke="#2D3139" stroke-width="1.2" />
      <text x="16" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#6B7280">
        R$ 4.000 a R$ 7.000
      </text>
      <!-- Seta Dropdown -->
      <polygon points="385,32 393,32 389,38" fill="#9CA3AF" />
    </g>

    <!-- LINHA 3: Mensagem / Detalhes -->
    <g transform="translate(40, 190)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#D1D5DB">
        Detalhes do Setup, Jogos Favoritos ou Sintomas do Equipamento
      </text>
      <rect x="0" y="10" width="880" height="70" rx="8" fill="#22252E" stroke="#2D3139" stroke-width="1.2" />
      <text x="16" y="35" font-family="'Inter', sans-serif" font-size="13" fill="#6B7280">
        Quero jogar Warzone e CS2 em 144Hz. Gostaria de gabinete com vidro aquário e iluminação branca...
      </text>
    </g>

    <!-- LINHA 4: Checkbox de Consentimento e Botão Enviar -->
    <g transform="translate(40, 295)">
      <!-- Checkbox -->
      <rect x="0" y="5" width="18" height="18" rx="4" fill="#FF5A26" />
      <path d="M4 14 L8 18 L15 9" stroke="#0D0E12" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <text x="28" y="19" font-family="'Inter', sans-serif" font-size="12" fill="#D1D5DB">
        Concordo em receber a cotação no meu WhatsApp oficial com os 2 anos de garantia.
      </text>

      <!-- Botão Enviar -->
      <g transform="translate(0, 40)" cursor="pointer">
        <rect width="880" height="48" rx="8" fill="#FF5A26" />
        <text x="440" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#0D0E12" text-anchor="middle" letter-spacing="1">
          ENVIAR SIMULAÇÃO PARA O WHATSAPP DA LOJA
        </text>
      </g>
    </g>
  </g>
</svg>
