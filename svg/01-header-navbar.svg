<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 80" width="1440" height="80">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12141A" />
      <stop offset="100%" stop-color="#0D0E12" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A26" />
      <stop offset="100%" stop-color="#FF7748" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do Header -->
  <rect width="1440" height="80" fill="url(#headerBg)" />
  <line x1="0" y1="79" x2="1440" y2="79" stroke="#22252E" stroke-width="1" />
  <line x1="360" y1="79" x2="1080" y2="79" stroke="#FF5A26" stroke-width="1.5" opacity="0.6" filter="url(#glow)" />

  <!-- Logo Extreme Gamer (Losango, Mouse & Circuitos) -->
  <g transform="translate(60, 18)" id="Logo-Extreme-Gamer">
    <!-- Losango de fundo -->
    <polygon points="22,0 44,22 22,44 0,22" fill="#181A20" stroke="#FF5A26" stroke-width="2" />
    <!-- Linhas de circuito -->
    <path d="M7 22 H14 M30 22 H37 M22 7 V14 M22 30 V37" stroke="#FF5A26" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="14" cy="22" r="1.5" fill="#FF5A26" />
    <circle cx="30" cy="22" r="1.5" fill="#FF5A26" />
    <!-- Mouse gamer estilizado no centro -->
    <path d="M19 16 C19 14 25 14 25 16 V27 C25 29 19 29 19 27 Z" fill="#FF5A26" />
    <line x1="22" y1="16" x2="22" y2="20" stroke="#0D0E12" stroke-width="1.2" stroke-linecap="round" />

    <!-- Tipografia do Logo -->
    <text x="56" y="22" font-family="'Oxanium', 'Orbitron', 'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      EXTREME <tspan fill="#FF5A26">GAMER</tspan>
    </text>
    <text x="57" y="36" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#9CA3AF" letter-spacing="2.5">
      INFORMÁTICA • FEIRA DE SANTANA
    </text>
  </g>

  <!-- Menu de Navegação Central -->
  <g transform="translate(520, 46)" id="Menu-Nav" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    <text x="0" y="0" fill="#FF5A26" cursor="pointer">Início</text>
    <circle cx="18" cy="8" r="2" fill="#FF5A26" />
    <text x="70" y="0" fill="#D1D5DB" cursor="pointer">Sobre Nós</text>
    <text x="175" y="0" fill="#D1D5DB" cursor="pointer">Máquinas</text>
    <text x="280" y="0" fill="#D1D5DB" cursor="pointer">Serviços</text>
    <text x="375" y="0" fill="#D1D5DB" cursor="pointer">Diferenciais</text>
    <text x="495" y="0" fill="#D1D5DB" cursor="pointer">Orçamento</text>
  </g>

  <!-- Botão WhatsApp / CTA Direita -->
  <g transform="translate(1220, 20)" id="Botao-WhatsApp" cursor="pointer">
    <rect width="160" height="40" rx="8" fill="url(#orangeGlow)" filter="url(#glow)" />
    <!-- Ícone WhatsApp -->
    <path d="M22 20 C22 25 18 29 13 29 C11.5 29 10 28.5 8.8 27.8 L5 29 L6.2 25.4 C5.4 24.1 5 22.6 5 21 C5 16 9.2 12 14.2 12 C18.5 12 22 15.5 22 20 Z" fill="#FFFFFF" transform="translate(10, 0) scale(0.9)" />
    <text x="44" y="25" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0D0E12" letter-spacing="0.5">
      Falar no Zap
    </text>
  </g>
</svg>
