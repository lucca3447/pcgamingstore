<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
  <defs>
    <radialGradient id="heroGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF5A26" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#FF5A26" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D0E12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A26" />
      <stop offset="100%" stop-color="#FF7748" />
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A26" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Escuro com Luz Neon Laranja -->
  <rect width="1440" height="600" fill="#0D0E12" />
  <rect width="1440" height="600" fill="url(#heroGlow)" />

  <!-- Linhas Tecnológicas Decorativas no Fundo -->
  <g stroke="#22252E" stroke-width="1.2" opacity="0.6">
    <line x1="60" y1="120" x2="600" y2="120" />
    <line x1="600" y1="120" x2="660" y2="180" />
    <line x1="660" y1="180" x2="800" y2="180" />
    <circle cx="600" cy="120" r="3" fill="#FF5A26" />
    <circle cx="660" cy="180" r="3" fill="#FF5A26" />
  </g>

  <!-- COLUNA ESQUERDA: Textos e Chamada para Ação -->
  <g transform="translate(80, 110)">
    <!-- Badge de Destaque -->
    <g>
      <rect width="320" height="32" rx="16" fill="#181A20" stroke="#FF5A26" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#FF5A26" />
      <text x="32" y="21" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#F3F4F6" letter-spacing="1">
        ÚNICA COM 2 ANOS DE GARANTIA PREMIUM
      </text>
    </g>

    <!-- Título Principal do Hero -->
    <text x="0" y="90" font-family="'Oxanium', 'Orbitron', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" line-height="1.1">
      PC GAMER PREMIUM
    </text>
    <text x="0" y="150" font-family="'Oxanium', 'Orbitron', sans-serif" font-size="52" font-weight="900" fill="#FF5A26">
      DE VERDADE
    </text>

    <!-- Subtítulo e Proposta de Valor -->
    <text x="0" y="200" font-family="'Inter', sans-serif" font-size="17" fill="#9CA3AF" font-weight="400">
      Montagens personalizadas de alta performance com marcas
    </text>
    <text x="0" y="226" font-family="'Inter', sans-serif" font-size="17" fill="#9CA3AF" font-weight="400">
      confiáveis, cable management de precisão e suporte técnico
    </text>
    <text x="0" y="252" font-family="'Inter', sans-serif" font-size="17" fill="#F3F4F6" font-weight="600">
      rápido e especializado em Feira de Santana, Bahia.
    </text>

    <!-- Botões de Ação -->
    <g transform="translate(0, 290)">
      <!-- Botão Primário (Néon) -->
      <g cursor="pointer">
        <rect width="240" height="52" rx="10" fill="url(#primaryBtn)" filter="url(#btnShadow)" />
        <text x="120" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#0D0E12" text-anchor="middle" letter-spacing="0.5">
          MONTAR MEU SETUP
        </text>
      </g>

      <!-- Botão Secundário (Outline) -->
      <g transform="translate(260, 0)" cursor="pointer">
        <rect width="210" height="52" rx="10" fill="#181A20" stroke="#2D3139" stroke-width="1.8" />
        <text x="105" y="32" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#F3F4F6" text-anchor="middle">
          Ver Nossos Serviços
        </text>
      </g>
    </g>

    <!-- Indicador de Carousel (Bootstrap) -->
    <g transform="translate(0, 390)">
      <rect width="40" height="5" rx="2.5" fill="#FF5A26" />
      <circle cx="60" cy="2.5" r="3" fill="#2D3139" />
      <circle cx="80" cy="2.5" r="3" fill="#2D3139" />
      <text x="105" y="6" font-family="'Inter', sans-serif" font-size="11" fill="#6B7280" font-weight="500">
        01 / 03 • Edição Especial 2026
      </text>
    </g>
  </g>

  <!-- COLUNA DIREITA: Ilustração Vetorial do PC Gamer e Selo de Garantia -->
  <g transform="translate(860, 60)" id="Setup-PC-Gamer">
    <!-- Luz ambiente atrás do gabinete -->
    <circle cx="260" cy="240" r="220" fill="url(#pcGlow)" />

    <!-- Gabinete Gamer (Chassis) -->
    <rect x="100" y="40" width="320" height="420" rx="16" fill="#181A20" stroke="#2D3139" stroke-width="3" />
    <!-- Vidro temperado lateral -->
    <rect x="120" y="60" width="280" height="380" rx="10" fill="#0D0E12" stroke="#FF5A26" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Fans RGB frontais (3 Ventoinhas) -->
    <!-- Fan 1 (Superior) -->
    <circle cx="340" cy="130" r="45" fill="none" stroke="#FF5A26" stroke-width="6" opacity="0.9" />
    <circle cx="340" cy="130" r="16" fill="#FF5A26" />
    <!-- Fan 2 (Meio) -->
    <circle cx="340" cy="240" r="45" fill="none" stroke="#00D2FF" stroke-width="6" opacity="0.9" />
    <circle cx="340" cy="240" r="16" fill="#00D2FF" />
    <!-- Fan 3 (Inferior) -->
    <circle cx="340" cy="350" r="45" fill="none" stroke="#FF5A26" stroke-width="6" opacity="0.9" />
    <circle cx="340" cy="350" r="16" fill="#FF5A26" />

    <!-- Placa de Vídeo RTX em Destaque Horizontal -->
    <rect x="140" y="270" width="160" height="46" rx="6" fill="#22252E" stroke="#00D2FF" stroke-width="1.5" />
    <text x="155" y="298" font-family="'Oxanium', sans-serif" font-size="12" font-weight="800" fill="#00D2FF" letter-spacing="1">
      GEFORCE RTX
    </text>
    <circle cx="270" cy="293" r="12" fill="none" stroke="#FF5A26" stroke-width="3" />

    <!-- Water Cooler (Bomba CPU no centro) -->
    <circle cx="210" cy="180" r="30" fill="#22252E" stroke="#FF5A26" stroke-width="3" />
    <text x="210" y="185" font-family="'Oxanium', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      XTREME
    </text>
    <!-- Mangueiras do Water Cooler -->
    <path d="M210 150 C240 110, 300 110, 340 130" stroke="#FF5A26" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Painel frontal detalhado com malha -->
    <rect x="100" y="40" width="20" height="420" fill="#12141A" />
    <line x1="110" y1="60" x2="110" y2="440" stroke="#FF5A26" stroke-width="2" stroke-dasharray="4,6" />

    <!-- Selo Flutuante: 2 Anos de Garantia Premium -->
    <g transform="translate(10, 310)" filter="url(#btnShadow)">
      <!-- Escudo / Selo -->
      <polygon points="100,0 200,0 215,60 100,120 -15,60 0,0" fill="#181A20" stroke="url(#badgeGlow)" stroke-width="3" />
      <text x="100" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFB800" text-anchor="middle" letter-spacing="1.5">
        GARANTIA TOTAL
      </text>
      <text x="100" y="65" font-family="'Oxanium', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">
        2 ANOS
      </text>
      <text x="100" y="85" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FF5A26" text-anchor="middle" letter-spacing="1">
        PREMIUM EXTREME
      </text>
    </g>
  </g>
</svg>
